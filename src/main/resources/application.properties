spring.application.name=notes

# File-based H2 in PostgreSQL compatibility mode. The database lives in ./data and survives restarts.
spring.datasource.url=jdbc:h2:file:./data/notes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate

# The health check lists each component it tested (such as the database) with its status, without further detail.
management.endpoint.health.show-components=always
