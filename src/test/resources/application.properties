# Test configuration. This file replaces src/main/resources/application.properties on the test classpath.
spring.application.name=notes

# In-memory H2 in PostgreSQL compatibility mode, so every test run starts with an empty database.
spring.datasource.url=jdbc:h2:mem:notes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
