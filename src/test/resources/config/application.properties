# Test overrides. Spring Boot loads this on top of src/main/resources/application.properties,
# so only the settings that differ in tests belong here.

# In-memory H2 in PostgreSQL compatibility mode, so every test run starts with an empty database.
spring.datasource.url=jdbc:h2:mem:notes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
